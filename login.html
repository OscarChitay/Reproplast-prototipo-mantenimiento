<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproplast - Iniciar Sesión</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        /* Contenedor principal del login */
        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            border: 1px solid #e0e0e0;
        }

        /* Header del login */
        .login-header {
            background: #7cb342;
            padding: 30px 30px 25px;
            text-align: center;
            color: white;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .company-name {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }

        .company-tagline {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 5px;
        }

        /* Formulario */
        .login-form {
            padding: 30px;
        }

        .welcome-text {
            text-align: center;
            margin-bottom: 25px;
        }

        .welcome-title {
            color: #333;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .welcome-subtitle {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-label {
            display: block;
            color: #555;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fafafa;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: #7cb342;
            background: white;
            box-shadow: 0 0 0 2px rgba(124, 179, 66, 0.1);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 16px;
            margin-top: 10px;
        }

        .form-input:focus + .input-icon {
            color: #7cb342;
        }

        /* Botón de login */
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #7cb342;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .login-btn:hover {
            background: #6a9c37;
        }

        .login-btn:active {
            background: #5d8a30;
        }

        /* Opciones adicionales */
        .login-options {
            margin-top: 20px;
            text-align: center;
        }

        .forgot-password {
            color: #7cb342;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .forgot-password:hover {
            color: #6a9c37;
            text-decoration: underline;
        }

        .divider {
            margin: 20px 0;
            text-align: center;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e0e0e0;
        }

        .divider span {
            background: white;
            padding: 0 12px;
            color: #999;
            font-size: 13px;
        }

        /* Mensaje de error */
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 15px;
            border-left: 3px solid #f44336;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            padding: 15px 30px 20px;
            color: #999;
            font-size: 12px;
            background: #f9f9f9;
            border-top: 1px solid #f0f0f0;
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            
            .login-container {
                margin: 0;
            }

            .login-header {
                padding: 25px 20px 20px;
            }

            .company-name {
                font-size: 20px;
            }

            .login-form {
                padding: 25px 20px;
            }

            .welcome-title {
                font-size: 18px;
            }
        }

        /* Loading state */
        .login-btn.loading {
            pointer-events: none;
            opacity: 0.7;
            position: relative;
        }

        .login-btn.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 16px;
            height: 16px;
            margin: -8px 0 0 -8px;
            border: 2px solid transparent;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Contenedor principal del login -->
    <div class="login-container">
        <!-- Header con logo -->
        <div class="login-header">
            <div class="logo">♻️</div>
            <h1 class="company-name">REPROPLAST</h1>
            <p class="company-tagline">Sistema de Gestión</p>
        </div>

        <!-- Formulario de login -->
        <div class="login-form">
            <div class="welcome-text">
                <h2 class="welcome-title">Bienvenido</h2>
                <p class="welcome-subtitle">Ingresa tus credenciales para acceder al sistema</p>
            </div>

            <!-- Mensaje de error -->
            <div class="error-message" id="errorMessage">
                Usuario o contraseña incorrectos. Por favor, intenta de nuevo.
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Ingresa tu usuario"
                        required
                        autocomplete="username"
                    >
                    <span class="input-icon">👤</span>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Ingresa tu contraseña"
                        required
                        autocomplete="current-password"
                    >
                    <span class="input-icon">🔒</span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Iniciar Sesión
                </button>
            </form>

            <div class="login-options">
                <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="divider">
                <span>o</span>
            </div>

            <div class="login-options">
                <p style="color: #666; font-size: 13px;">
                    ¿Necesitas ayuda? Contacta al administrador
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="login-footer">
            <p>&copy; 2025 Reproplast. Todos los derechos reservados.</p>
        </div>
    </div>

    <script>
        // Manejo del formulario de login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorMessage = document.getElementById('errorMessage');
            
            // Ocultar mensaje de error
            errorMessage.classList.remove('show');
            
            // Mostrar estado de carga
            loginBtn.classList.add('loading');
            loginBtn.textContent = '';
            
            // Simular proceso de autenticación
            setTimeout(() => {
                // Aquí iría la lógica real de autenticación
                // Por ahora, cualquier combinación válida redirige al sistema
                if (username.trim() && password.trim()) {
                    // Credenciales demo (puedes cambiarlas)
                    if (username === 'admin' && password === 'admin123') {
                        // Redireccionar al sistema principal
                        window.location.href = 'reproplast-sidebar-system.html';
                    } else {
                        // Mostrar error
                        showError();
                    }
                } else {
                    showError();
                }
            }, 800);
            
            function showError() {
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'Iniciar Sesión';
                errorMessage.classList.add('show');
            }
        });

        // Efecto de focus en inputs
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });

        // Validación en tiempo real
        document.getElementById('username').addEventListener('input', function() {
            document.getElementById('errorMessage').classList.remove('show');
        });

        document.getElementById('password').addEventListener('input', function() {
            document.getElementById('errorMessage').classList.remove('show');
        });

        // Tecla Enter para enviar formulario
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('loginForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
